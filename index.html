<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Proteus Effect — Generative Spatial Avatar Engine</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
      }
      body, html {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #060913;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      #app {
        width: 100%;
        height: 100%;
        position: relative;
      }
      /* Top experience status bar */
      .top-nav {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(15, 23, 42, 0.75);
        backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 999px;
        padding: 8px 24px;
        color: #f8fafc;
        display: flex;
        align-items: center;
        gap: 16px;
        z-index: 1000;
        box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      }
      .brand-title {
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.5px;
        background: linear-gradient(135deg, #38bdf8, #818cf8);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .status-pill {
        font-size: 12px;
        color: #94a3b8;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .pulse-dot {
        width: 8px;
        height: 8px;
        background: #22c55e;
        border-radius: 50%;
        animation: pulse 1.5s infinite;
      }
      @keyframes pulse {
        0% { opacity: 0.4; transform: scale(0.9); }
        50% { opacity: 1; transform: scale(1.2); }
        100% { opacity: 0.4; transform: scale(0.9); }
      }

      /* Why did this change banner & Feedback */
      .feedback-bar {
        position: absolute;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(14px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 12px;
        padding: 10px 20px;
        color: #e2e8f0;
        display: flex;
        align-items: center;
        gap: 20px;
        z-index: 1000;
        font-size: 13px;
      }
      .btn-feedback {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: #f1f5f9;
        padding: 4px 10px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 12px;
        transition: all 0.2s;
      }
      .btn-feedback:hover {
        background: rgba(255, 255, 255, 0.2);
      }
      #xr-button {
        display: none;
        background: #8b5cf6;
        color: white;
        border: none;
        padding: 6px 14px;
        border-radius: 999px;
        cursor: pointer;
        font-size: 12px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <!-- Top Status Header -->
      <header class="top-nav">
        <span class="brand-title">PROTEUS XR</span>
        <div class="status-pill">
          <div class="pulse-dot"></div>
          <span>Affective Loop Active</span>
        </div>
        <button id="xr-button">Enter AR Mode</button>
      </header>

      <!-- Exact Experience: "Why did this change?" & "Did this help?" -->
      <footer class="feedback-bar">
        <div>
          <span style="color:#94a3b8; font-size:11px; display:block;">Why did this change?</span>
          <span id="why-change-text" style="font-weight:500; color:#38bdf8;">Aura and lighting soft green reflecting relaxed baseline state.</span>
        </div>
        <div style="display:flex; align-items:center; gap:8px; border-left:1px solid rgba(255,255,255,0.15); padding-left:14px;">
          <span style="font-size:12px; color:#cbd5e1;">Did this help?</span>
          <button class="btn-feedback" onclick="alert('Feedback noted: Better (+)')">Better</button>
          <button class="btn-feedback" onclick="alert('Feedback noted: Same (=)')">Same</button>
          <button class="btn-feedback" onclick="alert('Feedback noted: Worse (-)')">Worse</button>
        </div>
      </footer>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
